name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            zlib1g-dev \
            libssl-dev \
            libpng-dev \
            libx11-dev \
            libxtst-dev \
            libxdamage-dev \
            libxfixes-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stupidvnc-linux
          path: |
            build/libstupidvnc.so
            build/lsdtest
            build/x11stupidvnc
          if-no-files-found: warn

